spring:
  application:
    name: miniproject
  config:
    import: classpath:application-analysis.yml   # B 단독 소유 파일 (§9-6)
  threads:
    virtual:
      enabled: true                              # Java 21 가상 스레드
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate                         # 스키마 정본은 db/schema.sql
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 16777216B                   # 16MiB
      max-request-size: 18874368B                # 18MiB
      file-size-threshold: 16777216B              # 디스크로 흘리지 않는다
      location: /run/speech-tmp                  # docker tmpfs

server:
  servlet:
    context-path: /api/v1

jwt:
  issuer: speech-service
  access-audience: speech-api
  refresh-audience: speech-auth
  access-ttl-seconds: 1800
  refresh-ttl-seconds: 1209600
  access-secret: ${JWT_ACCESS_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET}

app:
  allowed-origin: ${APP_ORIGIN:http://localhost:5173}
